services:
  - type: web
    name: fanlab-uz
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fanlab-db
          property: connectionString
databases:
  - name: fanlab-db
    plan: free
    region: oregon
    databaseName: fanlab
    user: fanlab
    ipAllowList: []
